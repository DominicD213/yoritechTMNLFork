name: Avolyn pairing checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-and-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: avolyn-headless-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.1.19
      - name: Test firmware cryptography and replay protection against desktop wire vectors
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          python scripts/test_pairing_crypto.py
      - name: Compile the actual XIAO headless pairing target (no upload)
        run: pio run -e avolyn_headless -j 4
