name: Avolyn firmware release candidate

# Firmware changes produce downloadable candidates. Only a separately requested
# manual job can create a draft release; nothing publishes a stable release.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'avolyn-release-profile.json'
      - 'scripts/*avolyn*'
      - '.github/workflows/avolyn-*.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/publish*.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'avolyn-release-profile.json'
      - 'scripts/*avolyn*'
      - '.github/workflows/avolyn-*.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/publish*.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Optional version assertion (leave empty to use the checked-out firmware version)
        type: string
        required: false
      create_draft_release:
        description: Create a private-to-maintainers DRAFT GitHub Release after building (never publishes automatically)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: avolyn-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test factory image packaging and OTA guards
        run: python -m unittest discover -s scripts -p 'test_avolyn*.py' -v
      - name: Validate release workflow syntax and expressions
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/build.yml .github/workflows/publish-firmware.yml .github/workflows/publish-dev-firmware.yml .github/workflows/publish-release-firmware.yml .github/workflows/avolyn-release-candidate.yml

  build-candidate:
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      AVOLYN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: avolyn-release-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Compile real XIAO ESP32-S3 headless firmware
        run: pio run -e avolyn_headless -j 4
      - name: Build checked factory package and GitHub manifest
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BOOT_DATA="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          test -f "$BOOT_DATA" || { echo "::error::Matching boot_app0.bin not found"; exit 1; }
          python scripts/build_avolyn_candidate.py \
            --build .pio/build/avolyn_headless \
            --version "$AVOLYN_VERSION" \
            --boot-app0 "$BOOT_DATA" \
            --output-dir out
      - name: Retain package, release manifest and checksum for review
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: avolyn-slate-firmware-candidate-${{ steps.package.outputs.version }}-attempt-${{ github.run_attempt }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
  publish-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release == true
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      AVOLYN_VERSION: ${{ needs.build-candidate.outputs.version }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.build-candidate.outputs.artifact-id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the validated candidate artifact
        shell: bash
        run: |
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Validated artifact ID is missing."; exit 1; }
      - name: Download already validated firmware release assets
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact-id }}
          path: out
      - name: Create draft prerelease (requires maintainer approval to publish)
        shell: bash
        run: |
          set -euo pipefail
          TAG="avolyn-fw-${AVOLYN_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" out/*.avolyn-firmware out/*.avolyn-firmware.release.json \
            --target "$GITHUB_SHA" \
            --title "Avolyn Slate firmware ${AVOLYN_VERSION} — candidate" \
            --notes "Headless XIAO ESP32-S3 development candidate. Validate secure pairing, USB, Wi-Fi and flash recovery on hardware before publication. Factory flash can reset credentials." \
            --draft --prerelease
          echo "Draft release created. It is NOT visible to the public Avolyn updater until you deliberately publish a stable release." >> "$GITHUB_STEP_SUMMARY"
